description = "Drop the always-on cstman activation rule into the current repo for every IDE agent"
prompt = "Write the per-repo cstman rule files into the current repo and report the result. If `src/tools/cstman-init.js` exists in the current repo (a cstman checkout), run `node src/tools/cstman-init.js {{args}}`. Otherwise run the standalone script (self-contained, supports stdin execution): `curl -fsSL https://raw.githubusercontent.com/JuliusBrussee/cstman/main/src/tools/cstman-init.js | node - {{args}}`. Use --dry-run first if the user did not pass --force, so we never silently overwrite an existing rule file."

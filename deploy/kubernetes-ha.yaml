# Highly available cstman-proxy: two or more replicas, the framework middleware
# store in Postgres, TLS on the listener, identity from a token map.
#
# Every replica serves every middleware session: handles, choices and originals
# live in Postgres, so the Service needs no session affinity. The proxy's own
# state (spend rows, its recovery store, proxy.log) stays per pod on an emptyDir;
# the proxy routes run in record mode, which needs no durable recovery.
#
# Needs runtime bin-v2.0.0 or later. This file holds no secrets. The image is
# pinned by digest, so a moved tag can never change what runs. Pods wait (CreateContainerConfigError) until these Secrets exist:
#
#   # Environment. CSTMAN_AUTH_TOKEN is optional: without it the provider
#   # routes refuse every request and the replicas serve the middleware only.
#   kubectl create secret generic cstman-proxy-ha \
#     --from-literal=CSTMAN_MIDDLEWARE_DATABASE_URL='postgres://cstman:<password>@<host>:5432/cstman?sslmode=verify-full' \
#     --from-literal=CSTMAN_METRICS_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=CSTMAN_AUTH_TOKEN="$(openssl rand -hex 32)" \
#     --from-literal=ANTHROPIC_API_KEY=<provider-key>
#   # Files. The database URL must say sslmode=verify-full (CAVE_ENV=prod
#   # below refuses any other mode), and the server certificate is verified
#   # against this CA bundle. Leave it empty (--from-literal=postgres-ca.crt=)
#   # only when a public CA in the image's system roots signs it; a private
#   # or cloud-provider database CA must go here.
#   kubectl create secret generic cstman-proxy-files \
#     --from-literal=middleware.key="$(openssl rand -base64 32)" \
#     --from-file=postgres-ca.crt=<database-ca-bundle.pem>
#   kubectl create secret tls cstman-proxy-tls --cert=tls.crt --key=tls.key
#   kubectl create secret generic cstman-proxy-tokens --from-file=tokens.yaml
#
# tokens.yaml maps token hashes (never tokens) to principals. List two hashes
# for a principal to rotate without an outage. The proxy re-reads the file
# every 10 s, but the kubelet refreshes Secret volumes on its own sync period,
# so an edit (a revocation included) takes about 1-2 minutes to reach the pods.
# To revoke at once: kubectl rollout restart deployment/cstman-proxy-ha
#
#   principals:
#     - name: team-a
#       namespaces: ["team-a/*"]
#       token_sha256: [<printf %s "$TOKEN" | sha256sum>]
#       quota: {rows: 200000, bytes: 134217728, requests_per_minute: 1200}
#     # With mTLS: a client certificate principal, named by source, no tokens.
#     - name: "mtls:uri:spiffe://example.org/ns/ci/sa/agent"
#       namespaces: ["ci/*"]
#
# Details: docs/technical/deploy.md#high-availability
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cstman-proxy-ha
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cstman-proxy-ha
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Keep full capacity during a rollout; new pods join once ready.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: cstman-proxy-ha
  template:
    metadata:
      labels:
        app: cstman-proxy-ha
    spec:
      serviceAccountName: cstman-proxy-ha
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        # Secret volumes below are group-readable through this group only.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: cstman-proxy-ha
      containers:
        - name: cstman-proxy
          # Pinned by digest to the signed bin-v2.1.0 image.
          image: ghcr.io/juliusbrussee/cstman-proxy:bin-v2.1.0@sha256:da293df3c6929c7b31eba580f7af74da0448e83a55a973cca86e81041877d0bb
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8787
          envFrom:
            - secretRef:
                name: cstman-proxy-ha
          env:
            # Production refusals: the database connection must be
            # sslmode=verify-full, and Bedrock/Gemini/Vertex endpoints must be
            # public provider hosts.
            - name: CAVE_ENV
              value: prod
            - name: CSTMAN_MODE
              value: record
            - name: CSTMAN_MIDDLEWARE_MODE
              value: compress
            - name: CSTMAN_MIDDLEWARE_TOKEN_MAP_FILE
              value: /etc/cstman/identity/tokens.yaml
            - name: CSTMAN_MIDDLEWARE_ENCRYPTION_KEY_FILE
              value: /etc/cstman/secrets/middleware.key
            - name: CAVE_POSTGRES_CA_CERT_FILE
              value: /etc/cstman/secrets/postgres-ca.crt
            - name: CSTMAN_TLS_CERT_FILE
              value: /etc/cstman/tls/tls.crt
            - name: CSTMAN_TLS_KEY_FILE
              value: /etc/cstman/tls/tls.key
            # mTLS: verify client certificates against a CA. A certificate is
            # the principal mtls:uri:<URI SAN>, else mtls:dns:<DNS SAN>; name
            # its token map entry that way. CSTMAN_TLS_CLIENT_CN_FALLBACK=true
            # adds mtls:cn:<CN> for certificates with neither SAN.
            # - name: CSTMAN_TLS_CLIENT_CA_FILE
            #   value: /etc/cstman/tls/ca.crt
          volumeMounts:
            - name: data
              mountPath: /data
            - name: identity
              mountPath: /etc/cstman/identity
              readOnly: true
            - name: secrets
              mountPath: /etc/cstman/secrets
              readOnly: true
            - name: tls
              mountPath: /etc/cstman/tls
              readOnly: true
          # Readiness stays 200 while the provider routes can serve, with the
          # body saying "middleware":"degraded" when Postgres cannot take a
          # write, so a database outage leaves inference up. Without
          # CSTMAN_AUTH_TOKEN the replicas serve the middleware only, and then
          # a replica that loses the database leaves the Service.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        # Per-pod proxy state only. Declaring the middleware store ephemeral is
        # not needed here: it is Postgres, and reports persistent: true.
        - name: data
          emptyDir:
            sizeLimit: 2Gi
        # 0440: root-owned, readable by fsGroup 65532 only (the process is
        # not root, so owner-only 0400 would lock it out).
        - name: identity
          secret:
            secretName: cstman-proxy-tokens
            defaultMode: 0440
        - name: secrets
          secret:
            secretName: cstman-proxy-files
            defaultMode: 0440
        - name: tls
          secret:
            secretName: cstman-proxy-tls
            defaultMode: 0440
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cstman-proxy-ha
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: cstman-proxy-ha
---
apiVersion: v1
kind: Service
metadata:
  name: cstman-proxy-ha
spec:
  type: ClusterIP
  selector:
    app: cstman-proxy-ha
  ports:
    - name: https
      port: 8787
      targetPort: https
---
# Only labelled client pods reach the proxy; it reaches DNS, Postgres and
# provider APIs over HTTPS. Narrow the egress blocks to your database and
# provider address ranges where you can. Kubelet probes are not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cstman-proxy-ha
spec:
  podSelector:
    matchLabels:
      app: cstman-proxy-ha
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              cstman-client: "true"
      ports:
        - port: 8787
          protocol: TCP
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 5432
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP

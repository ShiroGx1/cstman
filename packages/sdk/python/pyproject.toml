[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
# Public PyPI distribution name. `cstman` belongs to an unrelated project;
# keep distribution and import names distinct (`import cstman_cloud`).
name = "cstman-sdk"
version = "1.2.0"
description = "Stdlib-only Python client for CSTMAN gateway tracing, tool deferral, checkpoints, and recoverable compression."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = []
authors = [{name = "CSTMAN"}]
keywords = ["agents", "ai", "llm", "observability", "opentelemetry", "optimization"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://docs.caveman.so/docs/sdk/python"
Repository = "https://github.com/JuliusBrussee/cstman"
Issues = "https://github.com/JuliusBrussee/cstman/issues"

[tool.setuptools]
packages = ["cstman_cloud", "cstman_cloud.middleware"]

[tool.setuptools.package-data]
cstman_cloud = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
